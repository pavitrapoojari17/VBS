<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS — History</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--c1:#142C14;--c2:#2D5128;--c3:#537B2F;--c4:#8DA750;--c5:#E4EB9C;--text:#111;--text2:#4a5568;--text3:#718096;--border:#d1d5db;--white:#fff;}
        body{font-family:'Outfit',sans-serif;background:url('bg2.jpg') center/cover fixed no-repeat;min-height:100vh}
        .nav{background:var(--c1);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .nav-left{display:flex;align-items:center;gap:12px}
        .logo-box{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
        .nav-logo{font-size:16px;font-weight:700;color:#fff}
        .nav-btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff}
        .nav-btn:hover{background:rgba(255,255,255,.2)}
        .main{max-width:900px;margin:0 auto;padding:28px 24px}
        .page-title{font-size:20px;font-weight:700;color:var(--c1);margin-bottom:20px}
        .table-wrap{background:rgba(255,255,255,0.88);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.6);border-radius:14px;overflow:hidden}
        table{width:100%;border-collapse:collapse}
        thead tr{background:var(--c5);border-bottom:1px solid var(--c4)}
        th{padding:13px 18px;text-align:left;font-size:11px;font-weight:600;color:var(--c2);text-transform:uppercase;letter-spacing:.6px}
        td{padding:14px 18px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(0,0,0,0.06)}
        tbody tr:last-child td{border-bottom:none}
        tbody tr:hover td{background:rgba(228,235,156,0.4)}
        .id-cell{color:var(--text3);font-size:12px}
        .date-cell{color:var(--text3);font-size:12px}
        .empty-state{text-align:center;padding:60px;color:var(--text3);font-size:14px}
    </style>
</head>
<body>
<nav class="nav">
    <div class="nav-left"><div class="logo-box">V</div><span class="nav-logo">VBS Admin</span></div>
    <button class="nav-btn" onclick="goBack()">← Back to Admin</button>
</nav>
<div class="main">
    <div class="page-title">System History</div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>#</th><th>Description</th><th>Date</th></tr></thead>
            <tbody id="historyBody"><tr><td colspan="3" class="empty-state">Loading…</td></tr></tbody>
        </table>
    </div>
</div>
<script>
    const API='http://localhost:8081';
    const userId=localStorage.getItem('userId');
    async function loadHistories(){try{const res=await fetch(`${API}/histories`);if(!res.ok)throw new Error();const list=await res.json();const body=document.getElementById('historyBody');if(!list.length){body.innerHTML='<tr><td colspan="3" class="empty-state">No history records found</td></tr>';return;}body.innerHTML=list.map(h=>`<tr><td class="id-cell">#${h.id}</td><td>${esc(h.descripton||h.description||'')}</td><td class="date-cell">${h.date?new Date(h.date).toLocaleString():''}</td></tr>`).join('');}catch{document.getElementById('historyBody').innerHTML='<tr><td colspan="3" class="empty-state">Unable to load history. Ensure backend is running.</td></tr>';}}
    function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function goBack(){window.location.href=userId?`admin.html?id=${userId}`:'admin.html';}
    window.addEventListener('DOMContentLoaded',loadHistories);
</script>
</body>
</html>
