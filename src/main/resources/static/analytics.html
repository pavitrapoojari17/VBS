<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS — Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--c1:#142C14;--c2:#2D5128;--c3:#537B2F;--c4:#8DA750;--c5:#E4EB9C;--text:#111;--text2:#4a5568;--text3:#718096;--border:#d1d5db;--white:#fff;--err-bg:#fef2f2;--err-border:#fecaca;--err-text:#991b1b;--red:#dc2626;}
        body{font-family:'Outfit',sans-serif;background:url('bg2.jpg') center/cover fixed no-repeat;min-height:100vh}
        .nav{background:var(--c1);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .nav-left{display:flex;align-items:center;gap:12px}
        .logo-box{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
        .nav-logo{font-size:16px;font-weight:700;color:#fff}
        .nav-right{display:flex;gap:8px}
        .nav-btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff}
        .nav-btn:hover{background:rgba(255,255,255,.2)}
        .main{max-width:960px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
        .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
        .page-title{font-size:22px;font-weight:700;color:var(--c1)}
        .page-sub{font-size:13px;color:var(--text3);margin-top:2px}
        .filter-bar{display:flex;gap:10px;align-items:center}
        .filter-bar select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Outfit',sans-serif;color:var(--text);background:rgba(255,255,255,0.9);outline:none;cursor:pointer}
        .refresh-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;border:1.5px solid var(--border);background:rgba(255,255,255,0.9);color:var(--text2);transition:all .15s}
        .refresh-btn:hover{background:var(--c5);border-color:var(--c4);color:var(--c1)}
        .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
        .stat-card{background:rgba(255,255,255,0.88);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.6);border-radius:12px;padding:18px 20px}
        .sc-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
        .sc-val{font-size:22px;font-weight:700;color:var(--text)}
        .sc-val.green{color:var(--c3)}
        .sc-val.red{color:var(--red)}
        .sc-sub{font-size:11px;color:var(--text3);margin-top:4px}
        .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .chart-box{background:rgba(255,255,255,0.88);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.6);border-radius:12px;padding:22px}
        .chart-box.full{grid-column:1/-1}
        .chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:18px}
        .chart-wrap{position:relative;height:200px}
        .chart-wrap.tall{height:240px}
        .loading{text-align:center;padding:60px;color:var(--text3);font-size:14px}
        .spinner{width:32px;height:32px;border:3px solid var(--c5);border-top-color:var(--c3);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .msg{padding:12px 16px;border-radius:10px;font-size:13px;display:none}
        .msg.show{display:block}
        .msg.error{background:var(--err-bg);color:var(--err-text);border:1px solid var(--err-border)}
        @media(max-width:700px){.stat-grid{grid-template-columns:1fr 1fr}.chart-grid{grid-template-columns:1fr}.chart-box.full{grid-column:auto}}
    </style>
</head>
<body>
<nav class="nav">
    <div class="nav-left"><div class="logo-box">V</div><span class="nav-logo">VBS</span></div>
    <div class="nav-right">
        <button class="nav-btn" onclick="window.location.href='dashboard.html'">← Dashboard</button>
        <button class="nav-btn" onclick="logout()">Sign out</button>
    </div>
</nav>
<div class="main">
    <div class="page-header">
        <div><div class="page-title">Analytics</div><div class="page-sub" id="pageSub">Your financial overview</div></div>
        <div class="filter-bar">
            <select id="periodFilter" onchange="renderAll()">
                <option value="all">All time</option>
                <option value="3">Last 3 months</option>
                <option value="6" selected>Last 6 months</option>
                <option value="12">Last 12 months</option>
            </select>
            <button class="refresh-btn" onclick="loadAndRender()">↻ Refresh</button>
        </div>
    </div>
    <div id="pageMsg" class="msg"></div>
    <div class="stat-grid">
        <div class="stat-card"><div class="sc-lbl">Total income</div><div class="sc-val green" id="statIncome">₹0</div><div class="sc-sub">Credits received</div></div>
        <div class="stat-card"><div class="sc-lbl">Total expense</div><div class="sc-val red" id="statExpense">₹0</div><div class="sc-sub">Debits made</div></div>
        <div class="stat-card"><div class="sc-lbl">Net savings</div><div class="sc-val" id="statSavings">₹0</div><div class="sc-sub">Income − Expense</div></div>
        <div class="stat-card"><div class="sc-lbl">Transactions</div><div class="sc-val" id="statCount">0</div><div class="sc-sub">In selected period</div></div>
    </div>
    <div id="chartsArea"><div class="loading"><div class="spinner"></div>Loading charts…</div></div>
</div>
<script>
    const API='http://localhost:8081';
    let userId,allTxns=[],charts={};
    function validateUserAccess(){userId=localStorage.getItem('userId');if(!userId){window.location.href='login.html';return;}document.getElementById('pageSub').textContent=`Account #${userId} · financial overview`;}
    async function fetchTxns(){const res=await fetch(`${API}/passbook/${userId}`);if(!res.ok)throw new Error();return res.json();}
    function getFiltered(){const m=parseInt(document.getElementById('periodFilter').value)||9999;if(m===9999)return allTxns;const c=new Date();c.setMonth(c.getMonth()-m);return allTxns.filter(t=>new Date(t.date)>=c);}
    function isCredit(t){const d=t.description.toLowerCase();return d.includes('deposit')||d.includes('received');}
    function getCategory(desc){const d=desc.toLowerCase();if(d.includes('food')||d.includes('restaurant'))return 'Food';if(d.includes('travel')||d.includes('trip')||d.includes('train')||d.includes('bus')||d.includes('flight'))return 'Travel';if(d.includes('shopping')||d.includes('amazon')||d.includes('flipkart'))return 'Shopping';if(d.includes('rent')||d.includes('house'))return 'Rent';if(d.includes('medical')||d.includes('hospital'))return 'Medical';if(d.includes('sent to'))return 'Transfers out';if(d.includes('received'))return 'Transfers in';if(d.includes('deposit'))return 'Deposits';return 'Other';}
    function fmt(n){if(n>=100000)return '₹'+(n/100000).toFixed(1)+'L';if(n>=1000)return '₹'+(n/1000).toFixed(1)+'k';return '₹'+n.toFixed(0);}
    function updateStats(txns){const inc=txns.filter(t=>isCredit(t)).reduce((s,t)=>s+t.amount,0);const exp=txns.filter(t=>!isCredit(t)).reduce((s,t)=>s+t.amount,0);const net=inc-exp;document.getElementById('statIncome').textContent=fmt(inc);document.getElementById('statExpense').textContent=fmt(exp);const el=document.getElementById('statSavings');el.textContent=(net<0?'-':'')+fmt(Math.abs(net));el.className='sc-val '+(net>=0?'green':'red');document.getElementById('statCount').textContent=txns.length;}
    function buildCharts(){document.getElementById('chartsArea').innerHTML=`<div class="chart-grid"><div class="chart-box full"><div class="chart-title">Monthly income vs expense</div><div class="chart-wrap tall"><canvas id="monthlyChart"></canvas></div></div><div class="chart-box"><div class="chart-title">Income vs expense split</div><div class="chart-wrap"><canvas id="donutChart"></canvas></div></div><div class="chart-box"><div class="chart-title">Spending by category</div><div class="chart-wrap"><canvas id="categoryChart"></canvas></div></div></div>`;}
    function renderAll(){const txns=getFiltered();updateStats(txns);Object.values(charts).forEach(c=>c.destroy());charts={};if(!txns.length){document.getElementById('chartsArea').innerHTML='<div class="loading">No transactions in this period.</div>';return;}buildCharts();
    const buckets={};txns.forEach(t=>{const d=new Date(t.date);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(!buckets[key])buckets[key]={inc:0,exp:0};if(isCredit(t))buckets[key].inc+=t.amount;else buckets[key].exp+=t.amount;});
    const keys=Object.keys(buckets).sort();const labels=keys.map(k=>{const[y,m]=k.split('-');return new Date(+y,+m-1).toLocaleString('default',{month:'short',year:'2-digit'});});
    charts.monthly=new Chart(document.getElementById('monthlyChart'),{type:'bar',data:{labels,datasets:[{label:'Income',data:keys.map(k=>buckets[k].inc),backgroundColor:'rgba(83,123,47,.8)',borderRadius:5,borderSkipped:false},{label:'Expense',data:keys.map(k=>buckets[k].exp),backgroundColor:'rgba(220,38,38,.65)',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'Outfit',size:12},boxWidth:12}},tooltip:{callbacks:{label:ctx=>' ₹'+ctx.parsed.y.toLocaleString('en-IN')}}},scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{family:'Outfit',size:11},callback:v=>fmt(v)}},x:{grid:{display:false},ticks:{font:{family:'Outfit',size:11}}}}}});
    const totalInc=txns.filter(t=>isCredit(t)).reduce((s,t)=>s+t.amount,0);const totalExp=txns.filter(t=>!isCredit(t)).reduce((s,t)=>s+t.amount,0);
    charts.donut=new Chart(document.getElementById('donutChart'),{type:'doughnut',data:{labels:['Income','Expense'],datasets:[{data:[totalInc,totalExp],backgroundColor:['#537B2F','#dc2626'],borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{font:{family:'Outfit',size:12},boxWidth:12}},tooltip:{callbacks:{label:ctx=>' ₹'+ctx.parsed.toLocaleString('en-IN')}}}}});
    const cats={};txns.forEach(t=>{const c=getCategory(t.description);cats[c]=(cats[c]||0)+t.amount;});const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);const palette=['#142C14','#2D5128','#537B2F','#8DA750','#a8bc5e','#c6d47a'];
    charts.category=new Chart(document.getElementById('categoryChart'),{type:'bar',data:{labels:sorted.map(e=>e[0]),datasets:[{data:sorted.map(e=>e[1]),backgroundColor:sorted.map((_,i)=>palette[i%palette.length]),borderRadius:5,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' ₹'+ctx.parsed.x.toLocaleString('en-IN')}}},scales:{x:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{family:'Outfit',size:11},callback:v=>fmt(v)}},y:{grid:{display:false},ticks:{font:{family:'Outfit',size:11}}}}}});}
    async function loadAndRender(){document.getElementById('chartsArea').innerHTML='<div class="loading"><div class="spinner"></div>Loading charts…</div>';try{allTxns=await fetchTxns();renderAll();}catch{document.getElementById('pageMsg').className='msg error show';document.getElementById('pageMsg').textContent='Could not load data — make sure backend is running on port 8081.';document.getElementById('chartsArea').innerHTML='';}}
    function logout(){localStorage.clear();window.location.href='home.html';}
    window.addEventListener('DOMContentLoaded',()=>{validateUserAccess();loadAndRender();});
</script>
</body>
</html>
